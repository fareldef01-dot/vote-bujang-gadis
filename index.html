<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan Bujang Gadis</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); 
            margin: 0; 
            padding: 20px; 
            color: #1e293b; 
            min-height: 100vh;
        }
        header { padding: 30px 0; }
        h1 { color: #0284c7; font-size: 2.5rem; margin-bottom: 10px; }
        p.subtitle { color: #475569; font-size: 1.1rem; font-weight: 500; }
        
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1200px; margin: 20px auto; }
        
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.15); 
            width: 280px; 
            transition: transform 0.3s ease;
            position: relative;
        }
        .card:hover { transform: translateY(-8px); }
        
        .badge-no {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #0284c7;
            color: white;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        img { width: 100%; height: 280px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        
        h3 { margin: 10px 0 5px; color: #0f172a; font-size: 1.25rem; }
        .vote-box { background: #f8fafc; padding: 10px; border-radius: 8px; margin: 15px 0; border: 1px solid #e2e8f0; }
        .vote-count { font-size: 1.3rem; font-weight: bold; color: #0284c7; }
        
        input { width: 80%; padding: 10px; margin-bottom: 12px; text-align: center; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #0284c7; }
        
        button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        
        #loading { font-size: 1.2rem; color: #475569; margin-top: 50px; font-weight: 500; }
    </style>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="CLIENT_KEY_ANDA"></script> 
</head>
<body>

    <header>
        <h1>Pemilihan Bujang Gadis 2026</h1>
        <p class="subtitle">Dukung finalis favoritmu! 1 Vote = Rp 5.000</p>
    </header>
    
    <div id="loading">Memuat data finalis... Sabar ya ⏳</div>
    
    <div class="container" id="finalis-container"></div>

    <script>
        async function loadFinalis() {
            try {
                const response = await fetch('/api/finalis');
                const data = await response.json();
                
                const container = document.getElementById('finalis-container');
                const loading = document.getElementById('loading');
                
                loading.style.display = 'none';
                container.innerHTML = ''; 

                if (data.length === 0) {
                    container.innerHTML = '<p>Belum ada data finalis.</p>';
                    return;
                }

                data.forEach(finalis => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="badge-no">No. ${finalis.nomor || '-'}</div>
                        <img src="${finalis.foto}" alt="${finalis.nama}">
                        <h3>${finalis.nama}</h3>
                        <div class="vote-box">
                            <span class="vote-count">${finalis.vote}</span> Vote
                        </div>
                        <input type="number" id="input-${finalis.id}" value="1" min="1">
                        <button onclick="bayarVote('${finalis.id}')">Beri Dukungan</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = 'Gagal memuat data. Silakan refresh.';
            }
        }

        async function bayarVote(idFinalis) {
            const jumlahVote = document.getElementById(`input-${idFinalis}`).value;
            if (jumlahVote < 1) {
                alert("Jumlah vote minimal 1");
                return;
            }

            const namaVoter = prompt("Masukkan Nama Anda:") || "Pendukung Rahasia";

            try {
                const response = await fetch('/api/bayar-vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_finalis: idFinalis, jumlah_vote: parseInt(jumlahVote), nama_voter: namaVoter })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    window.snap.pay(data.token, {
                        onSuccess: function(result) {
                            alert("Pembayaran Sukses! Terima kasih, dukungan Anda telah tercatat.");
                            // Memuat ulang data finalis secara instan tanpa error tunnel
                            loadFinalis();
                        },
                        onPending: function(result) { 
                            alert("Menunggu pembayaran Anda."); 
                            loadFinalis();
                        },
                        onError: function(result) { 
                            alert("Pembayaran gagal! Silakan coba lagi."); 
                        },
                        onClose: function() { 
                            loadFinalis();
                        }
                    });
                } else {
                    alert("Gagal dari Midtrans:\n" + (data.detail || data.error || 'Kesalahan tidak dikenal'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Terjadi kesalahan sistem saat menghubungi server.");
            }
        }

        loadFinalis();
    </script>
</body>
</html>
