<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan Bujang & Gadis 2026</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-light: #e0f2fe;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #bae6fd;
            --shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.12), 0 8px 10px -6px rgba(2, 132, 199, 0.08);
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Modern Header */
        header { 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white;
            text-align: center; 
            padding: 40px 20px; 
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.2);
        }
        
        header h1 { 
            font-size: 1.8rem; 
            margin: 0 0 10px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }
        
        header p { 
            font-size: 1rem; 
            margin: 0; 
            opacity: 0.95; 
            font-weight: 400;
        }

        /* Main Selection Area */
        .main-container { 
            max-width: 480px; 
            width: 100%;
            margin: -25px auto 30px; 
            padding: 0 20px; 
            box-sizing: border-box;
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            z-index: 10;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid rgba(186, 230, 253, 0.6);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--primary);
            transition: width 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(2, 132, 199, 0.2);
            border-color: var(--primary);
        }

        .category-card:hover::before {
            width: 10px;
        }

        .category-card h2 {
            margin: 0 0 6px;
            color: var(--text-main);
            font-size: 1.35rem;
            font-weight: 700;
        }

        .category-card p {
            margin: 0 0 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn-vote {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .category-card:hover .btn-vote {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: transparent;
        }
    </style>
</head>
<body>

    <div>
        <header>
            <h1>Bujang & Gadis 2026</h1>
            <p>Pilih kategori dan berikan dukungan terbaikmu!</p>
        </header>

        <div class="main-container">
            <!-- Pilihan Kategori Bujang -->
            <a href="/vote-bujang.html" class="category-card">
                <h2>Pemilihan Bujang</h2>
                <p>Dukung finalis Bujang favorit pilihan Anda</p>
                <div class="btn-vote">Pilih Kategori Bujang</div>
            </a>

            <!-- Pilihan Kategori Gadis -->
            <a href="/vote-gadis.html" class="category-card">
                <h2>Pemilihan Gadis</h2>
                <p>Dukung finalis Gadis favorit pilihan Anda</p>
                <div class="btn-vote">Pilih Kategori Gadis</div>
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Bujang Gadis Official. All rights reserved.
    </footer>

</body>
</html>
